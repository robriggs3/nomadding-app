name: tests
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it obsoletes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assembled artifacts match src (drift guard)
        run: node tools/assemble.js && git diff --exit-code
      - name: Unit tests
        run: node tests/run.js
      # A real browser, because the unit suite has no Leaflet, no tiles and no
      # layout. On 2026-09-18 the map drew nothing for two days on every city
      # with no cached coordinates, with ZERO console errors, and nothing in
      # node could see it. This can: it asserts a guide with coordinates draws
      # real markers, a guide with none still draws a canvas, and the page
      # survives the tile CDN being unreachable.
      - name: Install a browser for the map checks
        run: npm ci --no-audit --no-fund && npx playwright install chromium
      - name: Headless map checks
        run: node tests/headless.js
      # The edge function is Deno, so node cannot run it. This suite drives the
      # real ai-proxy module with a mocked upstream and a mocked database, which
      # is the only way the money paths (the caps, the kill switch, the model
      # allowlist, the streaming pipe) get checked without spending anything.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge function tests
        run: deno test --allow-env --allow-read --allow-net --no-check supabase/functions/ai-proxy/test.ts
      - name: City datasets validate
        run: node tests/validate-city.js cities/example.json
